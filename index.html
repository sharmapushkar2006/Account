<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="#" class="back-link">&larr; Home</a>
            <h1>Account Management</h1>
        </header>

        <main class="content-grid">
            <section class="profile-section">
                <div class="profile-header">
                    <div class="avatar"id="avtar">JS</div>
                    <div class="profile-info">
                        <h2 id="name">$user_name_local_storage</h2>
                        <p id="email">$user_email_local_storage</p>
                    </div>
                </div>
                <button class="btn btn-primary edit-profile-btn">Edit profile</button>
            </section>
            <section class="card password-card">
                <h2>service not yet added</h2>
                <form>
                    <div class="form-group">
                        <label for="current-password">Current password</label>
                        <input type="password" id="current-password" name="current-password">
                    </div>
                    <div class="form-group">
                        <label for="new-password">New password</label>
                        <input type="password" id="new-password" name="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm new</label>
                        <input type="password" id="confirm-password" name="confirm-password">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-primary">Change password</button>
                    </div>
                </form>
            </section>
            <section class="card danger-card">
                <h2>Danger zone</h2>
                <p>Deleting your account is permanent.</p>
                <button class="btn btn-danger">Delete account</button>
                <button class="btn btn-danger">Or Logout</button>
            </section>

        </main>
    </div>
    <div id="information" style="display: none;">_ERROR_</div>
    <script>
        const avatarElement = document.getElementById('avtar');
        const userNameElement = document.getElementById('name');
        const userEmailElement = document.getElementById('email');
        userNameElement.textContent = localStorage.getItem('username') || 'Not found';
        userEmailElement.textContent = localStorage.getItem('email') || 'Not found';
        avatarElement.textContent = localStorage.getItem('username').charAt(0).toUpperCase() || 'N';
    </script>
    <script src='script.js'></script>
</body>
</html>
